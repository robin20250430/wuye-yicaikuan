name: Run Tests

# 触发条件：当代码推送到 main 分支，或者有 Pull Request 时触发
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest # 在最新的 Ubuntu 虚拟环境中运行

    steps:
    # 1. 把仓库代码拉取到虚拟环境中
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 选择你的 Python 版本

    # 3. 安装项目依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. 运行测试命令
    - name: Run pytest
      run: |
        pytest
